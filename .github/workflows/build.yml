name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build_type: [RelWithDebInfo, Debug]
        ui: [gui, cli]
        scripting: [lua, noscripts]
        exclude:
          - build_type: Debug
            ui: gui
          - build_type: RelWithDebInfo
            ui: cli
          - build_type: RelWithDebInfo
            scripting: noscripts
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: 0
    - name: Install Dependencies
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          libpixman-1-dev libfreetype6-dev libharfbuzz-dev zlib1g-dev \
          libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
          libfontconfig1-dev xvfb dpkg-dev
    - name: Install Skia
      if: ${{ matrix.ui == 'gui' }}
      shell: bash
      run: |
        this_dir="${{ github.workspace }}"
        skia_url=$(source $this_dir/laf/misc/skia-url.sh | xargs)
        skia_file=$(basename $skia_url)
        curl --ssl-revoke-best-effort -L -o "$skia_file" "$skia_url"
        unzip "$skia_file" -d skia
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        key: ${{ matrix.os }}-${{ matrix.ui }}-${{ matrix.scripting }}-${{ matrix.build_type }}
    - uses: aseprite/get-ninja@main
    - name: Generating Makefiles
      shell: bash
      run: |
        export enable_ccache=on

        if [[ "${{ matrix.ui }}" == "gui" ]] ; then
          export laf_backend=skia
        else
          export laf_backend=none
        fi

        if [[ "${{ matrix.scripting }}" == "lua" ]] ; then
          export enable_scripting=on
        else
          export enable_scripting=off
        fi

        export skia_arch=x64

        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DENABLE_TESTS=ON \
          -DENABLE_SCRIPTING=$enable_scripting \
          -DENABLE_CCACHE=$enable_ccache \
          -DLAF_BACKEND=$laf_backend \
          -DSKIA_DIR=$(realpath skia) \
          -DSKIA_LIBRARY_DIR=$(realpath skia/out/Release-$skia_arch)
    - name: Compiling
      shell: bash
      run: |
        cd build && ninja
    - name: Running C++ Tests
      shell: bash
      run: |
        export XVFB=xvfb-run
        cd build && $XVFB ctest --output-on-failure
    - name: Running CLI Tests
      if: ${{ matrix.scripting == 'lua' }}
      shell: bash
      run: |
        export XVFB=xvfb-run
        export ASEPRITE=$PWD/build/bin/aseprite
        cd tests
        $XVFB bash run-tests.sh

    - name: Package .deb
      if: ${{ matrix.build_type == 'RelWithDebInfo' && matrix.ui == 'gui' && matrix.scripting == 'lua' }}
      shell: bash
      run: |
        set -e
        VERSION=$(git describe --tags --always 2>/dev/null | sed 's/^v//')
        [ -z "$VERSION" ] && VERSION="0.0.0"
        PKG="aseprite_${VERSION}_amd64"

        DESTDIR="$PWD/$PKG" cmake --install build --prefix /usr

        mkdir -p "$PKG/DEBIAN"
        cat > "$PKG/DEBIAN/control" <<EOF
        Package: aseprite
        Version: ${VERSION}
        Section: graphics
        Priority: optional
        Architecture: amd64
        Depends: libc6, libx11-6, libxcursor1, libxi6, libxrandr2, libgl1, libfontconfig1, libfreetype6, libharfbuzz0b, zlib1g
        Maintainer: Aseprite Build <noreply@example.com>
        Description: Animated sprite editor and pixel art tool
         Aseprite is a program to create animations and pixel art.
        EOF

        dpkg-deb --build --root-owner-group "$PKG" "${PKG}.deb"

    - name: Upload .deb
      if: ${{ matrix.build_type == 'RelWithDebInfo' && matrix.ui == 'gui' && matrix.scripting == 'lua' }}
      uses: actions/upload-artifact@v4
      with:
        name: aseprite-deb
        path: aseprite_*.deb
